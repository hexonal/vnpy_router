[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vnpy_router"
version = "0.1.0"
description = "Split quote/trade gateway routing for VeighNa (force market data to a quote gateway, orders to a trade gateway)."
requires-python = ">=3.10"
dependencies = ["vnpy>=4.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["vnpy_router"]

# Point pyright at the shared VeighNa virtualenv. Without it, every vnpy import
# resolves against the system interpreter and reports as unresolved, burying the
# real diagnostics. Relative so it travels with the checkout: this package sits
# beside the vnpy fork that owns the venv.
[tool.pyright]
venvPath = ".."
venv = "vnpy/.venv"
typeCheckingMode = "standard"
