[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vnpy_router"
version = "0.1.0"
description = "Split quote/trade gateway routing for VeighNa (force market data to a quote gateway, orders to a trade gateway)."
requires-python = ">=3.10"
dependencies = ["vnpy>=4.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["vnpy_router"]
