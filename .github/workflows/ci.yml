name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      # lint 排在装依赖之前：它不需要任何依赖，装依赖失败时仍能给出信号。
      - name: Lint
        run: ruff check .

      # 兄弟仓已全部公开，checkout 用 runner 自带的 GITHUB_TOKEN 即可，
      # 不再需要人工配 PAT。private 时代的 HAS_TOKEN 门禁已移除 ——
      # 那道门禁的代价是所有测试被 skip，绿灯只代表 lint 过。
      - name: Checkout sibling repos
        uses: actions/checkout@v7
        with:
          repository: hexonal/vnpy_gatewaykit
          path: _deps/vnpy_gatewaykit

      - name: Install package
        run: |
          pip install mypy pytest
          # tests/test_run_gui_wiring.py 按 run_gui.py 的真实装载顺序接线，
          # 需要这两个 vnpy 官方 app（PyPI 公开包，不是私有兄弟仓）。
          # 它们只在测试里用到，所以不进 pyproject 的 dependencies。
          pip install vnpy_paperaccount vnpy_riskmanager
          pip install -e _deps/vnpy_gatewaykit
          pip install -e .

      - name: Type check
        run: mypy --strict vnpy_router

      # 这一步是本 workflow 存在的主要理由：vnpy 与 vnpy_ctastrategy 的既有 CI
      # 只跑 ruff/mypy/build，一个用例都不执行。
      #
      # 不需要 QT_QPA_PLATFORM=offscreen：实测导入 vnpy.trader.engine /
      # vnpy_gatewaykit / vnpy_paperaccount / vnpy_riskmanager / vnpy_router
      # 之后 sys.modules 里没有任何 PySide6 或 vnpy.trader.ui 模块 —— UI 组件由
      # MainWindow 惰性载入，本仓的测试从不构造它。
      - name: Test
        run: pytest tests -q

